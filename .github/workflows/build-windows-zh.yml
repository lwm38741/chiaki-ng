name: Windows x64 Chinese portable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows_x64-msys2:
    name: Build windows msys2 version
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      sdl2_compat_tag: 2.32.74
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git diffutils
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            fast_float:p
            fftw:p
            json-c:p
            libevent:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            qt6-tools:p
            qt6-translations:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p
            compiler-rt:p
            
      - name: Install python protobuf and zip
        run: |
          pip install protobuf
          pacman -S git make unzip zip --noconfirm

      - name: Validate Chinese catalog
        run: python scripts/check-translations.py

      - name: Build libbplacebo
        run: |
          scripts/build-libplacebo-windows.sh

      - name: Setup ffmpeg
        run: |
          curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip
          unzip ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip
          cp -a "ffmpeg-n9.0-latest-win64-gpl-shared-9.0/bin/." /mingw64/bin
          cp -a "ffmpeg-n9.0-latest-win64-gpl-shared-9.0/include/." /mingw64/include
          cp -a "ffmpeg-n9.0-latest-win64-gpl-shared-9.0/lib/." /mingw64/lib

      - name: Build sdl2-compat
        run: |
          INSTALL_PREFIX=/mingw64 scripts/build-sdl2-compat.sh .
          INSTALL_PREFIX=/mingw64 scripts/build-hidapi.sh .
          cp /mingw64/lib/pkgconfig/sdl2-compat.pc /mingw64/lib/pkgconfig/sdl2.pc

      - name: Configure chiaki-ng
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF

      - name: Build chiaki-ng
        run: |
          cmake --build build --config Release --clean-first --target chiaki chiaki-unit chiaki-translation-test
          
      - name: Run unit and translation tests
        run: |
          ctest --test-dir build -N > test-list.txt
          cat test-list.txt
          grep -q 'gui-translation' test-list.txt
          ctest --test-dir build --output-on-failure

      - name: Deploy chiaki-ng
        run: |
          ./scripts/deploy-windows-msys2.sh chiaki-ng-Win build/gui/chiaki.exe "${{ github.workspace }}/build/third-party/cpp-steam-tools" /mingw64 gui/src/qml

      - name: Add license and portable instructions
        run: |
          cp COPYING chiaki-ng-Win/
          cp -r LICENSES chiaki-ng-Win/
          cp scripts/windows-zh/Start-English.cmd scripts/windows-zh/README-*.txt chiaki-ng-Win/
          printf '%s\n' "${GITHUB_SHA}" > chiaki-ng-Win/SOURCE-COMMIT.txt

      - name: Verify deployed application and Qt translations
        run: |
          cp build/gui/chiaki-translation-test.exe chiaki-ng-Win/
          ./chiaki-ng-Win/chiaki-translation-test.exe --require-qt-translations
          rm chiaki-ng-Win/chiaki-translation-test.exe

      - name: Software OpenGL for the headless CI runner
        uses: ssciwr/setup-mesa-dist-win@6657792673a5d162d5f244db991ba45b4b68989f

      - name: Windows portable startup smoke test
        shell: pwsh
        run: ./scripts/windows-zh/smoke-test.ps1 -Directory chiaki-ng-Win

      - name: Package x64 Chinese portable
        run: |
          RELEASE_PACKAGE_FILE="chiaki-ng-win_x64-zh_CN-portable-1.10.1-zh.1.zip"
          zip -r "$RELEASE_PACKAGE_FILE" chiaki-ng-Win
          sha256sum "$RELEASE_PACKAGE_FILE" > SHA256SUMS.txt

      - name: Upload portable and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-win_x64-zh_CN-portable
          path: |
            chiaki-ng-win_x64-zh_CN-portable-*.zip
            SHA256SUMS.txt
            smoke-evidence/
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
